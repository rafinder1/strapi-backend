services:
  postgres:
    image: postgres:17
    container_name: pg-docker
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_page
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  strapi:
    image: node:22
    container_name: strapi
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      HOST: 0.0.0.0
      PORT: 1337

      DATABASE_CLIENT: postgres
      DATABASE_HOST: pg-docker
      DATABASE_PORT: 5432
      DATABASE_NAME: web_page
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: docker
      DATABASE_SSL: "false"
    ports:
      - "1337:1337"
    volumes:
      - ./backend:/app
    command: npm run develop

volumes:
  postgres-data:
